name: Daily Python Task
on:
  # 定时任务：北京时间每天 07:00 执行，按需修改
  schedule:
    - cron: '0 9,20 * * *'
      timezone: Asia/Shanghai
  # 支持手动点击运行测试
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          # 在这里写你需要的包，例如 pip install requests pandas
          pip install requests
          pip install lxml
          pip install urllib3

      - name: Run python script
        env:
          # 密钥在这里注入，在仓库 Settings → Secrets and variables → Actions 添加
          # API_KEY: ${{ secrets.API_KEY }}
        run: python fkst.py
